services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: copy-pen-lm-postgres
    restart: always
    environment:
      POSTGRES_USER: copy_pen_lm_user
      POSTGRES_PASSWORD: copy_pen_lm_password
      POSTGRES_DB: copy_pen_lm_db
    ports:
      - "5432:5432"
    volumes:
      - copy-pen-lm-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copy_pen_lm_user -d copy_pen_lm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  copy-pen-lm-postgres-data: